<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Kayıt Ol</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Kayıt Ol</h1>

    <form id="register-form" method="post">
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required />
      </div>
      <div class="form-group">
        <label for="password">Parola</label>
        <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="role">Rol</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Rol seçin</option>
          <option value="customer">Müşteri</option>
          <option value="supplier">Tedarikçi</option>
        </select>
      </div>
      <button type="submit" class="btn-primary" id="register-button">Kayıt Ol</button>
      <p class="small-text">Zaten üye misiniz? <a href="login.html">Giriş Yap</a></p>
    </form>

    <!-- ❗ Hata mesajı buraya yazılır -->
    <p id="error-msg" style="color:red; margin-top:10px;"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
